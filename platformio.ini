[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_tool = stlink
build_type = release
monitor_speed = 115200
build_src_filter = +<main.cpp> -<gateway.cpp>

[env:gateway_esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<gateway.cpp>
monitor_speed = 115200
